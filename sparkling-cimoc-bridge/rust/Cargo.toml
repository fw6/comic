[package]
name = "cimoc-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "cimoc_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

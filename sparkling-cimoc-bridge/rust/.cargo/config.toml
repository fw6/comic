# 本工程覆盖全局 artifactory 源，直连官方 crates.io。
# cargo 的 source replace-with 无法被低优先级 config 撤销，因此这里：
#   1) 把默认 registry 重置回 crates-io；
#   2) 用一个指向 crates.io 的具名 registry（crates-io-direct）覆盖 replace-with。
# 依赖解析（cargo build/test/ndk）与 cargo search 都会走 crates.io。
# 生效范围：在 rust/ 目录下运行 cargo 命令（build.sh 即从该目录执行）。

[registry]
default = "crates-io"

[registries.crates-io-direct]
index = "sparse+https://index.crates.io/"

[source.crates-io]
replace-with = "crates-io-direct"

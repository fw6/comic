name: Build & Publish APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sparkling-cimoc/package-lock.json

      - name: Install dependencies
        working-directory: sparkling-cimoc
        run: npm ci

      - name: Run tests
        working-directory: sparkling-cimoc
        run: npm test

      # sparkling-app-cli build --copy：产物 dist/main.lynx.bundle，
      # 并拷贝到原生 assets；gradle 默认从 ../../dist 打包该 bundle。
      - name: Build Lynx bundle
        working-directory: sparkling-cimoc
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: sparkling-cimoc/android
        run: ./gradlew assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cimoc-apk
          path: sparkling-cimoc/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/')
        run: cp sparkling-cimoc/android/app/build/outputs/apk/debug/app-debug.apk "Cimoc-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Cimoc ${{ github.ref_name }}
          files: Cimoc-${{ github.ref_name }}.apk
          generate_release_notes: true

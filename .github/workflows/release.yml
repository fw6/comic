name: Build & Publish APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # node 24 自带 npm 11；node 22 的 npm 10 在 CI 上 npm ci 会崩
          # （"Exit handler never called"），本地已验证 npm 11 全新安装正常
          node-version: 24
          cache: npm
          cache-dependency-path: sparkling-cimoc/package-lock.json

      - name: Install dependencies
        working-directory: sparkling-cimoc
        run: npm ci

      # app 以 file:../sparkling-cimoc-bridge 依赖方法包；方法包自身的
      # sparkling-method（rc.36）需单独 npm ci，否则测试/打包时无法解析。
      - name: Install bridge dependencies
        working-directory: sparkling-cimoc-bridge
        run: npm ci

      - name: Run tests
        working-directory: sparkling-cimoc
        run: npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.14206865"

      # Rust 核心：app 的 npm run build 会经 prebuild 触发 rust/build.sh。
      # Linux 上 build.sh 只构建 Android .so（iOS 走 macOS 本地构建）。
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      # sparkling-app-cli build --copy：产物 dist/main.lynx.bundle，
      # 并拷贝到原生 assets；gradle 默认从 ../../dist 打包该 bundle。
      # prebuild 钩子会先跑桥包的 rust/build.sh，产出 libcimoc_core.so。
      - name: Build Lynx bundle (and Rust core)
        working-directory: sparkling-cimoc
        run: npm run build

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: sparkling-cimoc/android
        run: ./gradlew assembleDebug

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cimoc-apk
          path: sparkling-cimoc/android/app/build/outputs/apk/debug/app-*-debug.apk

      - name: Rename APKs for release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp sparkling-cimoc/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "Cimoc-${{ github.ref_name }}-arm64-v8a.apk"
          cp sparkling-cimoc/android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk "Cimoc-${{ github.ref_name }}-armeabi-v7a.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Cimoc ${{ github.ref_name }}
          files: |
            Cimoc-${{ github.ref_name }}-arm64-v8a.apk
            Cimoc-${{ github.ref_name }}-armeabi-v7a.apk
          generate_release_notes: true

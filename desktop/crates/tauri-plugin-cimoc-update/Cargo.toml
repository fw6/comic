[package]
name = "tauri-plugin-cimoc-update"
version = "0.1.0"
description = "cimoc Android OTA 安装通道（PackageInstaller 会话 + 签名比对）"
authors = ["you"]
edition = "2021"
links = "tauri-plugin-cimoc-update"

[lib]
name = "tauri_plugin_cimoc_update"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }

[package]
name = "tauri-plugin-cimoc-render"
version = "0.1.0"
description = "cimoc 移动端隐藏 webview 渲染通道（Android WebView / iOS WKWebView 离屏加载页面并取回渲染后内容）"
authors = ["you"]
edition = "2021"
links = "tauri-plugin-cimoc-render"

[lib]
name = "tauri_plugin_cimoc_render"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
cimoc-core = { path = "../cimoc-core" }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }
